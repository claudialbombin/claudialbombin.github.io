<style>
:root{
  --bg:#F7F2ED; --ink:#101010; --mute:#6F6963; --line:rgba(16,16,16,.14); --paper:#EFE8DF; --dark:#151515; --accent:#E2593A;
  --gut:clamp(20px,3.2vw,44px);
  --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px; border-radius:4px}
.mono{font:400 12px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.02em}
.wrap{max-width:1440px; margin-inline:auto; padding-inline:var(--gut)}

/* header */
.hd{position:fixed; inset:0 0 auto 0; z-index:60; color:#fff; mix-blend-mode:difference; pointer-events:none; padding-top:env(safe-area-inset-top,0px)}
.hd-in{max-width:1440px; margin-inline:auto; padding:18px var(--gut); display:grid; grid-template-columns:1fr 1fr 1fr auto; align-items:center; gap:12px}
.hd a,.hd button{pointer-events:auto}
.hd .role{text-align:left}
.hd-r{display:flex; align-items:center; gap:14px; justify-self:end}
.lang{display:flex; gap:6px}
.lang button{opacity:.55} .lang button[aria-pressed="true"]{opacity:1; text-decoration:underline; text-underline-offset:3px}
.pill{display:inline-flex; align-items:center; justify-content:center; border:1px solid currentColor; border-radius:999px; padding:12px 22px; font:400 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.03em}
@media (max-width:640px){.hd-in{grid-template-columns:auto 1fr auto} .hd .role{display:none} .hd .brand{justify-self:start}}

/* menu */
.menu{position:fixed; inset:0; z-index:55; background:var(--bg); padding:calc(110px + env(safe-area-inset-top,0px)) var(--gut) calc(32px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; justify-content:space-between}
.menu[hidden]{display:none}
.menu nav{display:flex; flex-direction:column; gap:4px}
.menu nav a{font:400 clamp(3.2rem,12vw,7rem)/1 var(--serif); letter-spacing:-.01em; padding-block:4px; width:fit-content}
.menu nav a:hover{font-style:italic}
.menu .foot{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px}

/* type */
.h-name{font:400 clamp(4.6rem,17vw,15rem)/.84 var(--serif); letter-spacing:-.035em; margin:0}
.h-tag{font:400 clamp(3rem,9vw,8rem)/.92 var(--serif); letter-spacing:-.03em; margin:0; text-align:right}
.h3{font:400 clamp(2.4rem,5vw,4.2rem)/1 var(--serif); letter-spacing:-.02em; margin:0}
.big{font:400 clamp(2.1rem,5.4vw,4.6rem)/1.04 var(--serif); letter-spacing:-.02em; margin:0}
.muted{color:var(--mute)}

/* hero */
main{padding-top:calc(96px + env(safe-area-inset-top,0px))}
.hero{display:grid; gap:28px; padding-bottom:56px}
.intro{max-width:46ch; margin:0 0 0 auto; text-align:right}
.hero-photo{display:grid; grid-template-columns:minmax(0,720px) 1fr; gap:24px; align-items:end; margin-top:12px}
.arch{position:relative; border:1px solid var(--ink); border-radius:999px 999px 18px 18px; overflow:hidden; aspect-ratio:4/5; background:var(--paper)}
.arch img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 20%; display:block}
.arch .ph-fallback{position:absolute; inset:0; display:grid; place-items:center; font:400 clamp(6rem,22vw,13rem)/1 var(--serif); color:var(--ink); background:linear-gradient(160deg,#E9DCCB,#D8C6E8)}
.side{display:grid; gap:6px; justify-items:end; text-align:right; padding-bottom:6px}
@media (max-width:900px){.hero-photo{grid-template-columns:1fr} .side{justify-items:start; text-align:left}}

.slashes{display:flex; align-items:center; gap:18px; padding-block:clamp(36px,6vw,72px)}
.slashes svg{flex:1; height:16px; min-width:0}
.slashes .mono{white-space:nowrap}

/* cards */
.sec{padding-block:clamp(36px,7vw,90px) 0}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:34px}
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(36px,5vw,64px) clamp(20px,3vw,44px)}
.grid>*:nth-child(even){margin-top:clamp(0px,7vw,110px)}
@media (max-width:760px){.grid{grid-template-columns:1fr} .grid>*:nth-child(even){margin-top:0}}
.card{display:block}
.ph{position:relative; overflow:hidden; border-radius:14px; background:var(--paper); aspect-ratio:4/3}
.ph canvas{display:block; width:100%; height:100%; transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph canvas{transform:scale(1.035)}
.ph img{display:block; width:100%; height:100%; object-fit:contain}
.cta{position:absolute; top:14px; right:14px; background:var(--bg); color:var(--ink); border-radius:999px; padding:9px 14px}
.cap{display:flex; justify-content:space-between; gap:16px; margin-top:12px}
.cap .idx{color:var(--mute)}
.sub{margin:8px 0 0; color:var(--mute); max-width:46ch; font-size:.95rem}
.more{margin-top:clamp(40px,6vw,72px)}
.more a{display:flex; justify-content:space-between; gap:16px; padding-block:18px; border-top:1px solid var(--line)}
.more a:last-child{border-bottom:1px solid var(--line)}
.more a:hover .ttl{font-style:italic}
.more .ttl{font:400 clamp(1.6rem,3vw,2.4rem)/1.1 var(--serif)}
.pill-link{display:inline-flex; margin-top:36px}
.pill-link .pill:hover,.pill:hover{background:var(--ink); color:var(--bg)}

/* works title pill */
.pill-title{display:flex; align-items:center; justify-content:center; border:1px solid var(--ink); border-radius:999px; padding:clamp(28px,6vw,72px) 20px; font:400 clamp(4rem,15vw,13rem)/.95 var(--serif); letter-spacing:-.03em}

/* lab / sim */
.sim{margin-top:28px; border:1px solid var(--ink); border-radius:18px; background:var(--paper); overflow:hidden}
.sim-h{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 24px; padding:16px 18px; border-bottom:1px solid var(--line)}
.sim canvas{display:block; width:100%; aspect-ratio:16/7; min-height:280px}
.ctl-row{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)) auto; gap:16px 32px; align-items:end; padding:18px; border-top:1px solid var(--line)}
.ctl label{display:flex; justify-content:space-between; margin-bottom:10px}
.ctl input[type=range]{width:100%; margin:0; accent-color:var(--ink)}
.btn{border:1px solid var(--ink); border-radius:999px; padding:12px 20px; font:400 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.03em}
.btn:hover{background:var(--ink); color:var(--bg)}
.readout{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin:0; border-top:1px solid var(--line)}
.readout div{padding:16px 18px; border-right:1px solid var(--line)}
.readout div:last-child{border-right:0}
.readout dt{margin-bottom:8px; color:var(--mute)}
.readout dd{margin:0; font:400 clamp(1.8rem,3.4vw,2.6rem)/1.05 var(--serif); font-variant-numeric:tabular-nums}
.readout small{display:block; margin-top:6px; font:400 12px/1.4 var(--mono); color:var(--mute)}
.note{margin:16px 0 0; max-width:70ch; color:var(--mute); font-size:.95rem}
@media (max-width:720px){.ctl-row{grid-template-columns:1fr} .readout{grid-template-columns:1fr} .readout div{border-right:0; border-bottom:1px solid var(--line)} .readout div:last-child{border-bottom:0}}

/* about teaser + about page */
.tease{display:grid; grid-template-columns:minmax(0,1fr); gap:32px}
.tease .body{max-width:60ch; margin-left:auto}
.programs{margin-top:28px}
.collage{position:relative; min-height:clamp(520px,88vh,860px); display:grid; place-items:center; text-align:center}
.collage .words{font:400 clamp(3rem,9vw,8rem)/.95 var(--serif); letter-spacing:-.03em; margin:0; position:relative; z-index:2}
.tile{position:absolute; width:clamp(120px,17vw,250px); border-radius:12px; overflow:hidden; z-index:1; border:1px solid var(--ink)}
.tile canvas{display:block; width:100%; aspect-ratio:4/3}
.t1{left:4%; top:6%} .t2{right:3%; top:12%} .t3{left:0%; bottom:6%} .t4{left:34%; bottom:0%} .t5{right:6%; bottom:14%} .t6{left:20%; top:0%}
.t6,.t4{display:none}
@media (min-width:900px){.t6,.t4{display:block}}
.bio p{margin:0 0 .7em}
.rows{margin:0; padding:0; list-style:none; border-top:1px solid var(--ink)}
.rows li{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 24px; align-items:baseline; padding-block:20px; border-bottom:1px solid var(--line)}
.rows .nm{font:400 clamp(1.8rem,3.4vw,2.8rem)/1.05 var(--serif); letter-spacing:-.015em}
.rows .rl{grid-column:1; color:var(--mute)}
.rows .dt{grid-column:2; grid-row:1; text-align:right; white-space:nowrap}
.cols{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(36px,6vw,80px)}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.tags{margin:0; display:flex; flex-wrap:wrap; gap:8px}
.tags span{border:1px solid var(--line); border-radius:999px; padding:8px 14px}

/* detail */
.detail .ph.wide{aspect-ratio:16/10; border:1px solid transparent}
.dt-title{font:400 clamp(4rem,14vw,12rem)/.9 var(--serif); letter-spacing:-.035em; margin:clamp(28px,5vw,60px) 0 0}
.lead{font:400 clamp(.95rem,1.4vw,1.1rem)/1.6 var(--mono); max-width:64ch; margin:28px 0 0; text-transform:none; letter-spacing:0}
.meta{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:24px; margin:44px 0 0}
.meta dt{color:var(--mute); margin-bottom:4px}
.meta dd{margin:0; font:400 13px/1.5 var(--mono); text-transform:uppercase}
@media (max-width:760px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.figs{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0; margin-top:clamp(40px,6vw,80px); border-top:1px solid var(--ink)}
.figs div{padding:22px 20px 26px 0; border-bottom:1px solid var(--line)}
.figs b{display:block; font:400 clamp(3rem,6vw,5.4rem)/.95 var(--serif); letter-spacing:-.03em; font-weight:400}
.figs span{display:block; margin-top:10px; color:var(--mute); font-size:.95rem; max-width:28ch}
.gal{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(16px,3vw,40px); margin-top:clamp(40px,6vw,80px)}
@media (max-width:640px){.gal{grid-template-columns:1fr}}
.next{display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:clamp(56px,9vw,120px)}
.next .pill-title{width:min(100%,780px)}

/* footer */
.foot-card{margin:clamp(56px,9vw,120px) var(--gut) var(--gut); background:var(--dark); color:var(--bg); border-radius:24px; padding:clamp(28px,5vw,64px); min-height:min(80vh,640px); display:flex; flex-direction:column; justify-content:space-between; gap:60px; max-width:1440px}
@media (min-width:1500px){.foot-card{margin-inline:auto}}
.foot-card h2{font:400 clamp(2.4rem,6vw,5.4rem)/1 var(--serif); letter-spacing:-.025em; margin:0; text-align:right}
.contacts{display:grid; gap:14px; justify-items:end}
.contacts a{display:flex; align-items:baseline; gap:18px}
.contacts .lb{color:rgba(247,242,237,.5)}
.contacts .v{font:400 clamp(1.7rem,4.6vw,4.4rem)/1.05 var(--serif); letter-spacing:-.02em; overflow-wrap:anywhere; text-align:right}
.contacts a:hover .v{font-style:italic}
@media (max-width:640px){.contacts a{flex-direction:column; align-items:flex-end; gap:2px} .contacts .v{font-size:clamp(1.5rem,7vw,2.2rem)}}
.foot-b{display:flex; justify-content:space-between; gap:12px; color:rgba(247,242,237,.6)}

/* v3 additions */
.hero-photo .arch[data-photo]{max-width:720px}
.pillars{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(24px,4vw,56px); border-top:1px solid var(--ink); padding-top:28px}
.pillars p,.how p{margin:0; color:var(--mute); max-width:44ch}
.pl-h{font:400 clamp(2rem,3.6vw,3rem)/1 var(--serif); letter-spacing:-.02em; margin:0 0 12px}
@media (max-width:820px){.pillars{grid-template-columns:1fr}}
.two{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:clamp(28px,5vw,72px); align-items:center}
.two.rev{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
.two.rev .photo{order:2}
.two .big-p{font:400 clamp(1.3rem,2.2vw,1.9rem)/1.3 var(--serif); margin:22px 0 0; max-width:36em}
@media (max-width:820px){.two,.two.rev{grid-template-columns:1fr} .two.rev .photo{order:0}}
.photo{position:relative; aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:var(--paper); max-width:560px; width:100%}
.photo img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.photo-cap{position:absolute; left:12px; bottom:12px; right:12px; background:var(--bg); border-radius:999px; padding:8px 14px; width:fit-content; max-width:calc(100% - 24px)}
.how{margin-bottom:26px}
.rows .rl{display:block}
.rows .ds{grid-column:1/-1; color:var(--mute); font-size:.95rem; max-width:62ch}
.tile-img{display:block; width:100%; aspect-ratio:4/5; object-fit:cover}
.tile[data-photo]{background:var(--paper)}
.t1{width:clamp(120px,15vw,220px)} .t3{width:clamp(120px,15vw,220px)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 clamp(28px,4vw,48px)}
.chip{border:1px solid var(--ink); border-radius:999px; padding:10px 16px}
.chip:hover,.chip[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.works-intro{font-size:clamp(1.5rem,3vw,2.6rem); line-height:1.15; max-width:26em; margin:0 0 clamp(24px,4vw,44px)}
.cap-note{margin:12px 0 0; color:var(--mute); text-transform:none; max-width:70ch}
.cs-wrap{margin-top:clamp(48px,7vw,96px)}
.cs{display:grid; grid-template-columns:minmax(120px,1fr) minmax(0,3fr); gap:16px clamp(20px,4vw,60px); padding-block:clamp(28px,4vw,48px); border-top:1px solid var(--line)}
.cs-l{margin:0; color:var(--mute); font:400 12px/1.5 var(--mono); text-transform:uppercase; letter-spacing:.02em}
.cs-r{min-width:0}
.cs-r p{margin:0 0 1.1em; max-width:64ch; font-size:1.08rem; line-height:1.65}
.cs-r ul{margin:0 0 1.2em; padding-left:1.2em; max-width:64ch; line-height:1.6}
.cs-r li{margin-bottom:.4em}
.cs-r>*:last-child{margin-bottom:0}
@media (max-width:760px){.cs{grid-template-columns:1fr}}
.tw{overflow-x:auto; margin:0 0 1.2em; -webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse; width:100%; min-width:420px; font:400 13px/1.5 var(--mono)}
table.t th{text-align:left; font-weight:500; text-transform:uppercase; color:var(--mute); padding:8px 14px 8px 0; border-bottom:1px solid var(--ink)}
table.t td{padding:9px 14px 9px 0; border-bottom:1px solid var(--line); vertical-align:top}
pre.code{background:var(--dark); color:var(--bg); border-radius:12px; padding:16px 18px; overflow-x:auto; font:400 13px/1.6 var(--mono); margin:0 0 1.2em; max-width:100%}
.chart{display:block; width:100%; aspect-ratio:2/1; background:var(--paper); border-radius:14px}
.tease .body p{margin:0}
.pill-link{margin-top:36px}

.cs-r p.cap-note,p.cap-note{font:400 12px/1.5 var(--mono); color:var(--mute); margin:12px 0 0}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} .ph canvas{transition:none}}
</style>
</head>

var P = [
  { slug: 'pitwall', name: 'Pitwall', art: 'pitwall', repo: 'pitwall', live: 'https://claudialbombin.github.io/pitwall/', cat: 'quant',

    secs: [
      { h: { en: 'The question', es: 'La pregunta' }, b: [
        { p: { en: 'Every lap a race engineer faces the same call: pit now, or stay out on tyres that are wearing? A stop costs a guaranteed 19 to 24 seconds in the pit lane, depending on the circuit. Staying out costs an uncertain lap-time loss that grows as the tyres degrade. And a safety car can appear at any moment and make an otherwise poor stop almost free.', es: 'Cada vuelta, un ingeniero de carrera se enfrenta a la misma decisión: ¿parar ahora o seguir con unos neumáticos que se desgastan? Una parada cuesta entre 19 y 24 segundos seguros en el pit lane, según el circuito. Seguir fuera cuesta una pérdida de tiempo incierta que crece con la degradación. Y un safety car puede aparecer en cualquier momento y dejar una parada mala casi gratis.' } },
        { p: { en: 'Rules of thumb such as “pit around lap 25” ignore all of that. Pitwall treats the race as what it is: a sequential decision under uncertainty.', es: 'Las reglas de andar por casa, como “parar sobre la vuelta 25”, ignoran todo eso. Pitwall trata la carrera como lo que es: una decisión secuencial bajo incertidumbre.' } } ] },
      { h: { en: 'The model', es: 'El modelo' }, b: [
        { p: { en: 'The race is a Markov Decision Process. At every lap the state tracks:', es: 'La carrera es un proceso de decisión de Markov. En cada vuelta, el estado recoge:' } },
        { ul: [ { en: 'the lap number', es: 'el número de vuelta' }, { en: 'the tyre compound (soft, medium, hard, intermediate, wet)', es: 'el compuesto del neumático (blando, medio, duro, intermedio, lluvia)' }, { en: 'the age of the tyres, in laps', es: 'la edad de los neumáticos, en vueltas' }, { en: 'the position, from 1 to 20', es: 'la posición, de 1 a 20' }, { en: 'the discretised gaps to nearby cars', es: 'los huecos discretizados a los coches cercanos' }, { en: 'the number of stops already made', es: 'el número de paradas ya realizadas' }, { en: 'whether a safety car or virtual safety car is active', es: 'si hay safety car o virtual safety car activo' } ] },
        { p: { en: 'The action each lap is to stay out or to pit, choosing a compound. The objective is not greedy: it minimises the expected total race time over the laps that remain. The value function comes from a Bellman equation solved by backward recursion, which asks one question: is the immediate cost of pitting better than the expected value of waiting one more lap?', es: 'La acción en cada vuelta es seguir fuera o parar, eligiendo compuesto. El objetivo no es voraz: minimiza el tiempo total esperado de carrera en las vueltas que quedan. La función de valor sale de una ecuación de Bellman resuelta por recursión hacia atrás, que pregunta una sola cosa: ¿compensa más el coste inmediato de parar que el valor esperado de esperar una vuelta más?' } } ] },
      { h: { en: 'Tyres and safety cars', es: 'Neumáticos y safety car' }, b: [
        { p: { en: 'A Weibull hazard is fitted per compound to look for a degradation cliff. The saved fits are weak, with negative R², and find no clear cliff. On top sits a Gaussian Process with a Matérn 5/2 kernel, for the variation between circuits and temperatures. The model returns both a lap-time delta and its uncertainty.', es: 'Se ajusta un hazard de Weibull por compuesto para buscar un precipicio de degradación. Los ajustes guardados son débiles, con R² negativo, y no encuentran un precipicio claro. Encima va un proceso gaussiano con kernel Matérn 5/2, para la variación entre circuitos y temperaturas. El modelo devuelve el delta de tiempo por vuelta y su incertidumbre.' } },
        { code: 'delta, uncertainty = model.predict(Compound.MEDIUM, tyre_age=22, return_std=True)' },
        { p: { en: 'Safety cars are a non-homogeneous Poisson process for timing and a geometric distribution for duration, with a Bayesian layer that updates the deployment rate of each circuit from historical data.', es: 'Los safety cars son un proceso de Poisson no homogéneo para el momento y una distribución geométrica para la duración, con una capa bayesiana que actualiza la tasa de cada circuito a partir de datos históricos.' } } ] },
      { h: { en: 'Results', es: 'Resultados' }, b: [
        { p: { en: 'I corrected these numbers in November 2026 so that the site, notebooks and paper match the saved results. Against 57 real driver strategies from 2023, at 3 circuits, the policy is faster in 53% of comparisons, by a mean of 0.20 seconds. This is not yet a proven strategy edge.', es: 'Corregí estas cifras en noviembre de 2026 para que la web, los notebooks y el paper coincidan con los resultados guardados. Frente a 57 estrategias reales de pilotos de 2023, en 3 circuitos, la política es más rápida en el 53% de las comparaciones, con una media de 0,20 segundos. Todavía no es una ventaja de estrategia demostrada.' } },
        { tbl: { head: [ { en: 'Circuit', es: 'Circuito' }, { en: 'Policy faster', es: 'Política más rápida' }, { en: 'Mean delta', es: 'Delta medio' } ], rows: [ [ { en: 'Monaco', es: 'Mónaco' }, '85%', '+1.01 s' ], [ 'Silverstone', '72%', '+0.08 s' ], [ 'Monza', '0%', '−0.54 s' ] ] } },
        { p: { en: 'At Silverstone the MDP recommended lap 26. That beat Verstappen’s real lap 34 by 0.41 s and Gasly’s lap 32 by 0.33 s, but lost to Leclerc’s lap 19 by 0.52 s.', es: 'En Silverstone el MDP recomendó la vuelta 26. Eso mejoró la vuelta 34 real de Verstappen en 0,41 s y la 32 de Gasly en 0,33 s, pero perdió 0,52 s frente a la vuelta 19 de Leclerc.' } },
        { ul: [ { en: 'In the saved Monte Carlo run at Silverstone (N = 2,000), the MDP averages 81.73 minutes against 80.93 for the baseline: 48 s slower.', es: 'En la simulación Monte Carlo guardada de Silverstone (N = 2.000), el MDP promedia 81,73 minutos frente a 80,93 de la referencia: 48 s más lento.' }, { en: 'The deltas are modelled, not observed, and each circuit gets one recommended lap.', es: 'Los deltas son modelados, no observados, y cada circuito recibe una sola vuelta recomendada.' }, { en: 'The safety-car 90% intervals cover only 8% of laps.', es: 'Los intervalos del 90% del safety car cubren solo el 8% de las vueltas.' } ] } ] },
      { h: { en: 'Live, for €0', es: 'En directo, por 0 €' }, b: [
        { p: { en: 'A GitHub Actions job checks the calendar every 5 minutes. When a session is live, another job connects to the same Formula 1 SignalR feed FastF1 is built on, and every few seconds asks the same solver used offline what it would do given the real gaps, tyres and safety-car status. The snapshot goes to a git branch, and a static page polls it. No server, no database and no paid feed.', es: 'Un job de GitHub Actions revisa el calendario cada 5 minutos. Cuando hay una sesión en directo, otro job se conecta al mismo feed SignalR de Fórmula 1 en el que se apoya FastF1 y, cada pocos segundos, pregunta al mismo solver que se usa offline qué haría con los huecos, neumáticos y safety car reales. La instantánea va a una rama de git y una página estática la consulta. Sin servidor, sin base de datos y sin feed de pago.' } } ] },
      { h: { en: 'The finance connection', es: 'La conexión con finanzas' }, b: [
        { p: { en: 'The most interesting result is an isomorphism. Deciding whether to pit now or wait is the same problem as deciding whether to exercise an American option early: compare the immediate payoff with the expected value of continuing, and solve it by backward recursion. The same Snell-envelope machinery from quantitative finance applies to race strategy.', es: 'El resultado más interesante es un isomorfismo. Decidir si parar ahora o esperar es el mismo problema que decidir si ejercer una opción americana antes de tiempo: comparar el pago inmediato con el valor esperado de continuar y resolverlo por recursión hacia atrás. La misma maquinaria de la envolvente de Snell de las finanzas cuantitativas se aplica a la estrategia de carrera.' } } ] },
      { h: { en: 'Inside the repo', es: 'Dentro del repo' }, b: [
        { ul: [ { en: 'core/: MDP formulation, solver, tyre and safety-car models, race simulator.', es: 'core/: formulación del MDP, solver, modelos de neumáticos y safety car, simulador de carrera.' }, { en: 'data/: the FastF1 pipeline. live/: the live-timing companion.', es: 'data/: el pipeline de FastF1. live/: el seguimiento en directo.' }, { en: 'paper/: a full mathematical write-up.', es: 'paper/: un documento matemático completo.' }, { en: 'results/: backtest CSV and diagnostic plots. tests/: pytest suite.', es: 'results/: CSV del backtest y gráficos de diagnóstico. tests/: batería de pytest.' }, { en: 'A static GitHub Pages site with a Simulator, a Live dashboard, The Math and a Garage of animated pit-stop scenarios.', es: 'Un sitio estático en GitHub Pages con Simulador, panel en directo, The Math y un Garaje con escenarios animados de paradas.' } ] } ] }
    ] },

  { slug: 'beat-the-dealer', name: 'Beat the Dealer', art: 'blackjack', repo: 'beat-the-dealer', live: 'https://claudialbombin.github.io/beat-the-dealer/', cat: 'quant',
    short: { en: 'Blackjack solved by simulation, checked against an exact solver, and counted over a billion rounds.', es: 'Blackjack resuelto por simulación, comprobado con un solver exacto y contado en mil millones de rondas.' },
    lead: { en: 'Blackjack basic strategy derived by Monte Carlo simulation, checked cell by cell against an exact solver, and a Hi-Lo card-counting study over one billion simulated rounds. It comes with an interactive site where you can play, drill and run the simulations yourself.', es: 'Estrategia básica de blackjack derivada por simulación Monte Carlo, comprobada casilla a casilla con un solver exacto, y un estudio del conteo Hi-Lo sobre mil millones de rondas simuladas. Incluye una web interactiva para jugar, practicar y ejecutar las simulaciones.' },
    type: { en: 'Personal project', es: 'Proyecto personal' }, stack: 'Python · NumPy · C11 · JavaScript', methods: 'Monte Carlo · Exact solver · Hi-Lo',
    figs: [ { v: '380/380', d: { en: 'chart decisions where Monte Carlo agrees with the exact solver', es: 'decisiones de la tabla en las que Monte Carlo coincide con el solver exacto' } },
            { v: '10⁹', d: { en: 'simulated rounds in the counting study', es: 'rondas simuladas en el estudio de conteo' } },
            { v: '0.696%', d: { en: 'house edge with perfect basic strategy, ±0.007% (95% CI)', es: 'de ventaja de la casa con estrategia básica perfecta, ±0,007% (IC 95%)' } },
            { v: '+0.50%', d: { en: 'player edge gained per +1 of Hi-Lo true count', es: 'de ventaja ganada por cada +1 de cuenta real Hi-Lo' } } ],
    secs: [
      { h: { en: 'Thorp, 1962', es: 'Thorp, 1962' }, b: [
        { p: { en: 'Edward O. Thorp’s Beat the Dealer gave us the first computer-derived basic strategy and card-counting system. This project redoes that work with modern tools, and tests every step.', es: 'Beat the Dealer, de Edward O. Thorp, dio la primera estrategia básica derivada por ordenador y el primer sistema de conteo. Este proyecto rehace ese trabajo con herramientas modernas y comprueba cada paso.' } } ] },
      { h: { en: 'Basic strategy by simulation', es: 'Estrategia básica por simulación' }, b: [
        { p: { en: 'For every decision and every legal action, the solver simulates the rest of the hand 2,000,000 times and averages the profit. Two details make it a correct solver and not a heuristic:', es: 'Para cada decisión y cada acción legal, el solver simula el resto de la mano 2.000.000 de veces y promedia el beneficio. Dos detalles hacen que sea un solver correcto y no una heurística:' } },
        { ul: [ { en: 'Backward induction: after a hit, the rest of the hand must be played optimally too, so states are solved in an order where everything a hit can lead to is already known.', es: 'Inducción hacia atrás: después de pedir, el resto de la mano también debe jugarse de forma óptima, así que los estados se resuelven en un orden en el que ya se conoce todo aquello a lo que puede llevar pedir.' }, { en: 'Common random numbers: the actions are compared against the same simulated dealer hands, so a difference reflects the decision and not sampling luck.', es: 'Números aleatorios comunes: las acciones se comparan contra las mismas manos simuladas del crupier, de modo que la diferencia refleja la decisión y no la suerte del muestreo.' } ] },
        { p: { en: 'With NumPy vectorisation and one process per dealer upcard, it runs in about two minutes.', es: 'Con vectorización en NumPy y paralelismo por carta del crupier, tarda unos dos minutos.' } } ] },
      { h: { en: 'The exact reference', es: 'La referencia exacta' }, b: [
        { p: { en: 'With an infinite deck every draw is independent, so the game can be solved exactly by recursion. All 380 chart cells agree. Three of them (11 vs A, 16 vs 10, soft 15 vs 4) are statistical ties at 2M hands, and the exact solver confirms the Monte Carlo pick. The exact solver itself matches the published 6-deck chart in every cell except soft 13 vs 5, a known card-removal effect.', es: 'Con baraja infinita cada carta es independiente, así que el juego se puede resolver exactamente por recursión. Las 380 casillas coinciden. Tres de ellas (11 contra A, 16 contra 10, 15 blando contra 4) son empates estadísticos con 2M de manos, y el solver exacto confirma la elección de Monte Carlo. El propio solver exacto coincide con la tabla publicada de 6 barajas en todas las casillas salvo 13 blando contra 5, un efecto conocido de retirada de cartas.' } } ] },
      { h: { en: 'What counting is worth', es: 'Cuánto vale contar' }, b: [
        { p: { en: 'A C11 port plays the real 6-deck shoe at about 5 million rounds per second per thread. The conclusion is honest: counting works, but in this game the edge is thin. The count predicts the next hand very reliably, but only about a quarter of rounds are dealt at a positive count.', es: 'Una versión en C11 juega el zapato real de 6 barajas a unos 5 millones de rondas por segundo y por hilo. La conclusión es honesta: contar funciona, pero en este juego la ventaja es pequeña. La cuenta predice muy bien la siguiente mano, pero solo una cuarta parte de las rondas se reparte con cuenta positiva.' } },
        { tbl: { head: [ { en: 'Metric', es: 'Métrica' }, { en: 'Value', es: 'Valor' } ], rows: [
          [ { en: 'House edge, perfect basic strategy', es: 'Ventaja de la casa, estrategia básica perfecta' }, '0.696% ± 0.007%' ],
          [ { en: 'Edge per +1 true count', es: 'Ventaja por cada +1 de cuenta real' }, '+0.50%' ],
          [ { en: 'True count where the player gains the edge', es: 'Cuenta real a partir de la que gana el jugador' }, '≈ +0.9' ],
          [ { en: 'Counter’s edge, 1–12 spread', es: 'Ventaja del contador, apuesta de 1 a 12' }, '+0.19%' ],
          [ { en: 'Counter’s edge, 1–8 spread, leaving at negative counts', es: 'Ventaja del contador, apuesta de 1 a 8, dejando la mesa con cuenta negativa' }, '+0.80%' ] ] } },
        { p: { en: 'Limits: the counter never deviates from the chart, the chart uses the infinite-deck model, and surrender, re-splitting and insurance are not modelled.', es: 'Límites: el contador nunca se desvía de la tabla, la tabla usa el modelo de baraja infinita, y no se modelan la rendición, volver a dividir ni el seguro.' } } ] },
      { h: { en: 'The site', es: 'La web' }, b: [
        { ul: [ { en: 'Play: a full table with a coach that grades every decision and shows the expected-value cost of mistakes.', es: 'Jugar: una mesa completa con un entrenador que evalúa cada decisión y muestra el coste en valor esperado de los errores.' }, { en: 'Drill: rapid two-card decisions at their real frequencies, with a mastery map.', es: 'Practicar: decisiones rápidas de dos cartas con sus frecuencias reales y un mapa de dominio.' }, { en: 'Strategy chart: change a rule and the whole game is re-solved in the browser.', es: 'Tabla de estrategia: cambia una regla y el juego entero se vuelve a resolver en el navegador.' }, { en: 'Monte Carlo lab: watch estimates and their 95% bands converge on the exact answer.', es: 'Laboratorio Monte Carlo: mira cómo las estimaciones y sus bandas del 95% convergen a la respuesta exacta.' }, { en: 'Card counting: a betting ramp you can edit, with edge, variance, N0 and risk of ruin.', es: 'Conteo: una rampa de apuestas editable, con ventaja, varianza, N0 y riesgo de ruina.' } ] },
        { p: { en: 'It uses plain ES modules with no framework and no build step. The exact solver is ported to JavaScript and checked against the Python values to 10⁻⁶. The Python and C implementations are tested against each other, with CI across all three languages.', es: 'Usa módulos ES sin framework ni compilación. El solver exacto está portado a JavaScript y comprobado con los valores de Python hasta 10⁻⁶. Las implementaciones de Python y C se comprueban entre sí, con integración continua en los tres lenguajes.' } } ] }
    ] },

  { slug: 'monte-carlo-option-pricer', name: 'Option Pricer', art: 'option', repo: 'monte-carlo-option-pricer', cat: 'quant',
    short: { en: 'European, Asian and barrier options under Black-Scholes and Heston, in Python and C.', es: 'Opciones europeas, asiáticas y con barrera bajo Black-Scholes y Heston, en Python y C.' },
    lead: { en: 'A pricing engine for European, Asian and barrier options under two models: Black-Scholes, with constant volatility, and Heston, where volatility itself is random. It estimates the Greeks three ways and compares them on variance. Written twice, in Python and in C.', es: 'Un motor de valoración de opciones europeas, asiáticas y con barrera bajo dos modelos: Black-Scholes, con volatilidad constante, y Heston, donde la volatilidad es aleatoria. Estima las griegas de tres formas y las compara por varianza. Escrito dos veces, en Python y en C.' },
    type: { en: 'Personal project', es: 'Proyecto personal' }, stack: 'Python · C · pytest', methods: 'Monte Carlo · Black-Scholes · Heston',
    figs: [ { v: '0.006%', d: { en: 'relative error at 500K paths against the closed form', es: 'error relativo con 500K trayectorias frente a la fórmula cerrada' } },
            { v: '77', d: { en: 'unit tests in Python', es: 'tests unitarios en Python' } },
            { v: '~6×', d: { en: 'lower variance, pathwise vs likelihood-ratio Greeks', es: 'menos varianza, griegas pathwise frente a likelihood-ratio' } },
            { v: '2×', d: { en: 'faster in C than in Python for 500K paths', es: 'más rápido en C que en Python con 500K trayectorias' } } ],
    secs: [
      { h: { en: 'Why', es: 'Por qué' }, b: [
        { p: { en: 'The project is built to show quantitative finance through implementation rather than theory alone: apply stochastic calculus, understand how Monte Carlo converges, know the trade-offs between ways of computing Greeks, and write the same engine in two languages. It does all of that, end to end.', es: 'El proyecto está hecho para mostrar finanzas cuantitativas mediante la implementación y no solo la teoría: aplicar cálculo estocástico, entender cómo converge Monte Carlo, conocer las diferencias entre formas de calcular las griegas y escribir el mismo motor en dos lenguajes. Lo hace todo, de principio a fin.' } } ] },
      { h: { en: 'Two models', es: 'Dos modelos' }, b: [
        { p: { en: 'Black-Scholes assumes constant volatility. It has an exact solution, which makes it the ground truth everything else is checked against. Heston lets volatility be random and mean-reverting:', es: 'Black-Scholes supone volatilidad constante. Tiene solución exacta, así que es la verdad contra la que se comprueba todo lo demás. Heston deja que la volatilidad sea aleatoria y revierta a la media:' } },
        { code: 'dS = r·S·dt + √v·S·dW¹\ndv = κ(θ − v)·dt + ξ·√v·dW²\ncorr(dW¹, dW²) = ρ' },
        { ul: [ { en: 'κ = 2.0, the speed of mean reversion', es: 'κ = 2,0, la velocidad de reversión a la media' }, { en: 'θ = 0.04, the long-run variance', es: 'θ = 0,04, la varianza a largo plazo' }, { en: 'ξ = 0.30, the volatility of volatility', es: 'ξ = 0,30, la volatilidad de la volatilidad' }, { en: 'ρ = −0.70, the leverage correlation', es: 'ρ = −0,70, la correlación de apalancamiento' } ] },
        { p: { en: 'Heston has no closed form, so it is simulated with an Euler–Maruyama scheme that absorbs the variance at zero, with correlated Brownian increments built through a Cholesky decomposition. The discretisation bias is linear in the time step; at daily steps it is around 0.01 to 0.02, small next to the Monte Carlo error.', es: 'Heston no tiene forma cerrada, así que se simula con un esquema de Euler–Maruyama que absorbe la varianza en cero, con incrementos brownianos correlacionados mediante una descomposición de Cholesky. El sesgo de discretización es lineal en el paso de tiempo; con pasos diarios ronda 0,01–0,02, pequeño frente al error de Monte Carlo.' } } ] },
      { h: { en: 'Three options', es: 'Tres opciones' }, b: [
        { tbl: { head: [ { en: 'Option', es: 'Opción' }, { en: 'Payoff', es: 'Pago' }, { en: 'Price', es: 'Precio' }, { en: 'Note', es: 'Nota' } ], rows: [
          [ { en: 'European call, closed form', es: 'Call europea, forma cerrada' }, 'max(S_T − K, 0)', '10.4506', { en: 'ground truth', es: 'verdad de referencia' } ],
          [ { en: 'European call, Monte Carlo (500K paths)', es: 'Call europea, Monte Carlo (500K)' }, 'max(S_T − K, 0)', '10.4512', { en: '0.006% error', es: 'error del 0,006%' } ],
          [ { en: 'Asian call, arithmetic average', es: 'Call asiática, media aritmética' }, 'max(avg S − K, 0)', '5.8234', { en: '44.3% cheaper than European', es: '44,3% más barata que la europea' } ],
          [ { en: 'Up-and-out barrier call, B = 120', es: 'Call con barrera up-and-out, B = 120' }, 'max(S_T − K, 0) if max S < B', '6.1245', { en: '41.4% cheaper; 23.45% chance of knock-out', es: '41,4% más barata; 23,45% de probabilidad de knock-out' } ] ] } },
        { p: { en: 'Averaging lowers the effective volatility, which is why the Asian option costs less. The barrier option costs less because it can be knocked out. Under Heston, at-the-money prices sit within ±2% of Black-Scholes; the differences grow in the tails.', es: 'Promediar reduce la volatilidad efectiva, por eso la opción asiática cuesta menos. La opción con barrera cuesta menos porque puede anularse. Bajo Heston, los precios at-the-money quedan dentro de un ±2% de Black-Scholes; las diferencias crecen en las colas.' } } ] },
      { h: { en: 'Convergence', es: 'Convergencia' }, b: [
        { p: { en: 'The Monte Carlo error falls as 1/√N: ten times more paths cut it by about 3.16. The measured standard errors follow the theoretical line almost exactly.', es: 'El error de Monte Carlo cae como 1/√N: diez veces más trayectorias lo dividen por unos 3,16. Los errores estándar medidos siguen casi exactamente la línea teórica.' } },
        { chart: 'conv', alt: { en: 'Log-log chart of standard error against number of paths', es: 'Gráfico log-log del error estándar frente al número de trayectorias' }, cap: { en: 'Standard error against paths, log-log. Dots: 10K, 100K, 500K and 1M paths from the README. Dashed: the 1/√N line through the first point.', es: 'Error estándar frente a trayectorias, log-log. Puntos: 10K, 100K, 500K y 1M del README. Discontinua: la recta 1/√N por el primer punto.' } } ] },
      { h: { en: 'Greeks, three ways', es: 'Griegas, de tres formas' }, b: [
        { p: { en: 'Pathwise differentiates the payoff: very low variance, but it needs a smooth payoff. Likelihood ratio differentiates the probability density: it works for any payoff, at the price of noise. Finite differences reprice twice and are the reference. Against the Black-Scholes closed form:', es: 'Pathwise deriva el pago: muy poca varianza, pero necesita un pago suave. Likelihood ratio deriva la densidad de probabilidad: sirve para cualquier pago, a costa de más ruido. Las diferencias finitas revaloran dos veces y son la referencia. Frente a la fórmula cerrada de Black-Scholes:' } },
        { tbl: { head: [ { en: 'Method', es: 'Método' }, 'Delta', { en: 'Error', es: 'Error' }, 'Vega', { en: 'Error', es: 'Error' } ], rows: [
          [ 'Black-Scholes', '0.6368', '–', '37.524', '–' ],
          [ 'Pathwise', '0.6370', '0.025%', '37.530', '0.016%' ],
          [ 'Likelihood ratio', '0.6372', '0.065%', '37.541', '0.046%' ],
          [ { en: 'Finite differences', es: 'Diferencias finitas' }, '0.6368', '0.013%', '37.522', '0.005%' ] ] } },
        { p: { en: 'Pathwise has a standard error of about 0.0002; likelihood ratio about 0.0012, roughly six times more. The barrier option shows why you need both: its payoff is discontinuous, so the pathwise estimate is unreliable, while likelihood ratio gives a delta of 0.3452, in line with finite differences at about 0.34.', es: 'Pathwise tiene un error estándar de unos 0,0002; likelihood ratio, unos 0,0012, aproximadamente seis veces más. La opción con barrera muestra por qué hacen falta ambos: su pago es discontinuo, así que la estimación pathwise no es fiable, mientras que likelihood ratio da una delta de 0,3452, en línea con las diferencias finitas, en torno a 0,34.' } } ] },
      { h: { en: 'Python and C', es: 'Python y C' }, b: [
        { tbl: { head: [ '', 'Python', 'C' ], rows: [
          [ { en: '500K paths', es: '500K trayectorias' }, '~10 s', '~5 s' ],
          [ { en: 'Style', es: 'Estilo' }, { en: 'object-oriented', es: 'orientado a objetos' }, { en: 'procedural', es: 'procedural' } ],
          [ { en: 'Dependencies', es: 'Dependencias' }, 'NumPy, SciPy, Matplotlib', { en: 'none, standard library only', es: 'ninguna, solo librería estándar' } ],
          [ 'RNG', 'PCG-64', 'Mersenne Twister (MT19937)' ],
          [ { en: 'Normal CDF', es: 'CDF normal' }, 'scipy.stats', 'Abramowitz & Stegun' ],
          [ { en: 'Memory', es: 'Memoria' }, { en: 'garbage collected', es: 'recolector de basura' }, 'malloc / free' ] ] } },
        { ul: [ { en: 'MT19937 instead of rand(): a period of 2^19937−1 against 2^31−1, better statistics and reproducible runs.', es: 'MT19937 en lugar de rand(): periodo de 2^19937−1 frente a 2^31−1, mejores propiedades estadísticas y ejecuciones reproducibles.' }, { en: 'Box–Muller for normals, caching the second one so each normal costs one uniform on average.', es: 'Box–Muller para las normales, guardando la segunda para que cada normal cueste un uniforme de media.' }, { en: 'Manual memory, because Heston with many steps needs around 800 MB and stack arrays are not enough.', es: 'Memoria manual, porque Heston con muchos pasos necesita unos 800 MB y los arrays en pila no bastan.' }, { en: 'A normal CDF approximation with a maximum error of 7.5×10⁻⁸, far below the Monte Carlo error, which removes the need for GSL.', es: 'Una aproximación de la CDF normal con error máximo de 7,5×10⁻⁸, muy por debajo del error de Monte Carlo, lo que evita depender de GSL.' } ] } ] },
      { h: { en: 'Tests', es: 'Tests' }, b: [
        { p: { en: 'The Python side has 77 tests: 24 for the models, 26 for the options and 27 for the Greeks. The C side has an integrated test mode that checks results against deterministic seeds.', es: 'La parte de Python tiene 77 tests: 24 para los modelos, 26 para las opciones y 27 para las griegas. La parte de C tiene un modo de test integrado que comprueba resultados con semillas deterministas.' } },
        { code: 'cd python && pip install -r requirements.txt && python main.py\ncd C && make && make run' } ] }
    ] },

  { slug: 'salchi-helper', name: 'Salchi', art: 'salchi', img: 'assets/salchi.jpg', imgBg: '#FFF7EA', repo: 'salchi-helper', cat: 'software',
    short: { en: 'A floating dachshund that keeps your to-do list in sight, on Mac, Windows and Linux.', es: 'Un salchicha flotante que mantiene tu lista de tareas a la vista, en Mac, Windows y Linux.' },
    lead: { en: 'Checking your to-do list shouldn’t be another to-do. Salchi is a tiny dachshund that sits on top of everything on your screen, typing at its laptop. The sticker on the laptop shows how many tasks are left. Hover over it and the whole list opens.', es: 'Mirar tu lista de tareas no debería ser otra tarea. Salchi es un pequeño perro salchicha que se queda encima de todo lo que hay en tu pantalla, tecleando en su portátil. La pegatina del portátil dice cuántas tareas quedan. Pasa el ratón por encima y se abre la lista entera.' },
    type: { en: 'Personal project · released', es: 'Proyecto personal · publicado' }, stack: 'Swift · Electron · Apps Script', methods: 'Desktop apps · Product design',
    figs: [ { v: '3', d: { en: 'platforms: macOS, Windows and Linux', es: 'plataformas: macOS, Windows y Linux' } }, { v: '2', d: { en: 'editions: synced with Notion, or entirely local', es: 'ediciones: sincronizada con Notion o totalmente local' } }, { v: '1', d: { en: 'glance to see what is left', es: 'vistazo para saber qué queda' } } ],
    secs: [
      { h: { en: 'What it does', es: 'Qué hace' }, b: [
        { ul: [ { en: 'Floats above every app, on every desktop, even over full-screen windows.', es: 'Flota sobre todas las apps, en todos los escritorios, incluso sobre ventanas a pantalla completa.' }, { en: 'Hover to see the list; move away and it folds back. Drag it anywhere, or pin the list open.', es: 'Pasa el ratón para ver la lista; al apartarlo se recoge. Se puede arrastrar a cualquier sitio o dejar la lista fijada.' }, { en: 'Due dates with an optional time: overdue tasks turn red, today’s turn orange, and the list sorts itself.', es: 'Fechas con hora opcional: las vencidas se ponen en rojo, las de hoy en naranja y la lista se ordena sola.' }, { en: 'Dated tasks can appear in Google Calendar.', es: 'Las tareas con fecha pueden aparecer en Google Calendar.' }, { en: 'In the Notion edition, an assistant connected to your Notion can add tasks for you.', es: 'En la edición con Notion, un asistente conectado a tu Notion puede añadirte tareas.' } ] } ] },
      { h: { en: 'Two editions', es: 'Dos ediciones' }, b: [
        { p: { en: 'Every platform comes in two flavours that share all of their code. With Notion, a database is the back end, so the same list reaches every computer and your phone. Without it, tasks live in a small file on your computer: no accounts, no setup and nothing leaves the machine.', es: 'Cada plataforma viene en dos versiones que comparten todo el código. Con Notion, una base de datos hace de back end y la misma lista llega a todos tus ordenadores y al móvil. Sin Notion, las tareas viven en un pequeño archivo en tu ordenador: sin cuentas, sin configuración y sin que nada salga de la máquina.' } } ] },
      { h: { en: 'How it is built', es: 'Cómo está hecho' }, b: [
        { tbl: { head: [ { en: 'Part', es: 'Parte' }, { en: 'Built with', es: 'Hecho con' }, { en: 'In short', es: 'En resumen' } ], rows: [
          [ 'Mac', 'Swift, SwiftUI, AppKit', { en: 'A borderless panel that never steals focus, plus a menu-bar counter', es: 'Un panel sin bordes que nunca roba el foco, más un contador en la barra de menús' } ],
          [ 'Windows · Linux', 'Electron', { en: 'One code base, packaged as an installer, an AppImage and a .deb', es: 'Un solo código, empaquetado como instalador, AppImage y .deb' } ],
          [ 'Calendar', 'Google Apps Script', { en: 'Mirrors dated Notion tasks into Google Calendar', es: 'Copia las tareas con fecha de Notion en Google Calendar' } ] ] } },
        { ul: [ { en: 'The app talks to one task-store interface with two implementations; the edition is chosen at packaging time.', es: 'La app habla con una única interfaz de tareas con dos implementaciones; la edición se elige al empaquetar.' }, { en: 'Optimistic updates: the screen changes instantly, the save runs in the background and rolls back if it fails.', es: 'Actualizaciones optimistas: la pantalla cambia al instante, el guardado va en segundo plano y se revierte si falla.' }, { en: 'A hover that never gets stuck: the window resizes under the cursor, so the apps watch its position themselves.', es: 'Un hover que nunca se queda atascado: la ventana cambia de tamaño bajo el cursor, así que las apps vigilan ellas mismas su posición.' }, { en: 'End-to-end tests drive the real desktop interface against a fake Notion.', es: 'Los tests de extremo a extremo manejan la interfaz real de escritorio contra un Notion falso.' } ] } ] }
    ] },

  { slug: 'cececat', name: 'CeceCat', art: 'cece', repo: 'cececat', live: 'https://claudialbombin.github.io/cececat/', cat: 'software',
    short: { en: 'A debate tournament manager that runs entirely from one web page.', es: 'Un gestor de torneos de debate que funciona entero desde una sola página web.' },
    lead: { en: 'A pairs-based debate tournament manager. Create a tournament with a guided wizard, generate each round’s pairings, distribute judges, collect scores by hand or live from each judge’s phone, and keep the standings. There is no server to run and nothing to install: index.html is one file.', es: 'Un gestor de torneos de debate por parejas. Crea el torneo con un asistente guiado, genera los emparejamientos de cada ronda, reparte a los jueces, recoge las puntuaciones a mano o en directo desde el móvil de cada juez y lleva la clasificación. No hay servidor que mantener ni nada que instalar: index.html es un solo archivo.' },
    type: { en: 'Personal project', es: 'Proyecto personal' }, stack: 'JavaScript · Firestore · EmailJS', methods: 'Pairing · Assignment',
    figs: [ { v: '2', d: { en: 'formats: Academic and British Parliamentary', es: 'formatos: académico y British Parliamentary' } }, { v: '6', d: { en: 'steps to create a tournament', es: 'pasos para crear un torneo' } }, { v: '3', d: { en: 'layers of backup', es: 'capas de copia de seguridad' } }, { v: '1', d: { en: 'HTML file holds the whole app', es: 'archivo HTML contiene toda la aplicación' } } ],
    secs: [
      { h: { en: 'Why', es: 'Por qué' }, b: [
        { p: { en: 'I compete in debate, and running a tournament means pairings, rooms, judges and scores under time pressure. CeceCat puts all of it on one page that keeps working offline. The two optional parts, live scores and judge emails, simply stay off if they are not configured.', es: 'Compito en debate, y llevar un torneo significa emparejamientos, salas, jueces y puntuaciones con prisa. CeceCat lo pone todo en una página que sigue funcionando sin conexión. Las dos partes opcionales, puntuaciones en directo y correos a los jueces, simplemente no se activan si no se configuran.' } } ] },
      { h: { en: 'Judges that really rotate', es: 'Jueces que rotan de verdad' }, b: [
        { p: { en: 'For each round the algorithm compares every possible combination of room and judge and keeps the one with the fewest repeats. It does not decide room by room in a fixed order, so who shares a panel really changes from round to round.', es: 'En cada ronda, el algoritmo compara todas las combinaciones posibles de sala y juez y se queda con la que menos repite. No decide sala por sala en un orden fijo, así que quién comparte mesa cambia de verdad de una ronda a otra.' } },
        { ul: [ { en: 'A trainee is never the chair of a room if another judge is available.', es: 'Un juez en prácticas nunca preside una sala si hay otro juez disponible.' }, { en: 'It avoids repeating a judge pairing, and a judge seeing the same team twice.', es: 'Evita repetir parejas de jueces y que un juez vea dos veces al mismo equipo.' }, { en: 'It repairs itself: after a reload or an old backup, it rebuilds each judge’s history from the rounds already played.', es: 'Se repara sola: tras recargar o importar una copia antigua, reconstruye el historial de cada juez a partir de las rondas ya jugadas.' } ] } ] },
      { h: { en: 'Pairings and scores', es: 'Emparejamientos y puntuaciones' }, b: [
        { p: { en: 'Rounds are paired by standings, avoid repeat opponents where possible and balance who has held each position. Each judge gets one link for the whole tournament. Only the chair can send a score from it, and the central desk always reviews it before it counts.', es: 'Las rondas se emparejan por clasificación, evitan repetir rivales cuando es posible y equilibran quién ha ocupado cada posición. Cada juez recibe un solo enlace para todo el torneo. Solo quien preside puede enviar la puntuación desde él, y la mesa central siempre la revisa antes de que cuente.' } } ] },
      { h: { en: 'Nothing gets lost', es: 'No se pierde nada' }, b: [
        { ul: [ { en: 'Automatic saving in the browser on every change.', es: 'Guardado automático en el navegador con cada cambio.' }, { en: 'A downloadable .json copy to continue on another computer, and a readable .txt report.', es: 'Una copia .json descargable para seguir en otro ordenador y un informe .txt legible.' }, { en: 'Automatic snapshots per round to a folder on disk, using the File System Access API in Chromium browsers.', es: 'Copias automáticas por ronda en una carpeta del disco, con la File System Access API en navegadores Chromium.' } ] },
        { p: { en: 'It also imports PDFs offline, with an embedded library.', es: 'También importa PDF sin conexión, con una librería integrada.' } } ] }
    ] },

  { slug: 'scm-heston-filter', name: 'Heston Filter', art: 'heston', repo: 'scm-heston-filter', cat: 'quant',
    short: { en: 'A particle filter that tracks a volatility nobody can observe.', es: 'Un filtro de partículas que sigue una volatilidad que nadie observa.' },
    lead: { en: 'A particle filter that tracks volatility, which nobody observes, from prices, which are noisy. It implements Sequential Monte Carlo on the Heston stochastic-volatility model.', es: 'Un filtro de partículas que sigue la volatilidad, que nadie observa, a partir de los precios, que llevan ruido. Implementa Monte Carlo secuencial sobre el modelo de volatilidad estocástica de Heston.' },
    type: { en: 'Personal project', es: 'Proyecto personal' }, stack: 'Python', methods: 'Sequential Monte Carlo · Heston', figs: [],
    secs: [
      { h: { en: 'The problem', es: 'El problema' }, b: [
        { p: { en: 'In the Heston model volatility is not a number you can look up. It is a hidden state that moves randomly and can only be seen through prices, which carry noise. To price an option or measure risk you still need it. So the question is how to recover a moving, unobserved quantity from noisy observations.', es: 'En el modelo de Heston la volatilidad no es un número que se pueda consultar. Es un estado oculto que se mueve al azar y que solo se ve a través de los precios, que llevan ruido. Para valorar una opción o medir riesgo hace falta igualmente. La pregunta es cómo recuperar una cantidad que se mueve y no se observa a partir de observaciones ruidosas.' } } ] },
      { h: { en: 'The model', es: 'El modelo' }, b: [
        { code: 'dS = r·S·dt + √v·S·dW¹\ndv = κ(θ − v)·dt + ξ·√v·dW²\ncorr(dW¹, dW²) = ρ' },
        { p: { en: 'The price follows one equation and its variance v follows another, correlated with the first. Only the price is observed.', es: 'El precio sigue una ecuación y su varianza v sigue otra, correlacionada con la primera. Solo se observa el precio.' } } ] },
      { h: { en: 'The method', es: 'El método' }, b: [
        { p: { en: 'A particle filter keeps a cloud of hypotheses about the hidden variance, called particles. At each step every particle is moved forward with the model’s dynamics and weighted by how well it explains the price that was actually observed. The cloud is then resampled so that good hypotheses multiply and bad ones disappear. The result is a running estimate of the latent volatility, with its uncertainty, that updates as each new price arrives.', es: 'Un filtro de partículas mantiene una nube de hipótesis sobre la varianza oculta, las partículas. En cada paso, cada partícula avanza con la dinámica del modelo y se pondera según lo bien que explica el precio observado. Después se remuestrea la nube para que las buenas hipótesis se multipliquen y las malas desaparezcan. El resultado es una estimación continua de la volatilidad latente, con su incertidumbre, que se actualiza con cada precio nuevo.' } } ] },
      { h: { en: 'In this repo', es: 'En este repo' }, b: [
        { p: { en: 'A Python implementation of that filter on the Heston model, under the MIT licence. It is the companion of my option pricer: the pricer simulates Heston forward, the filter works backward from data.', es: 'Una implementación en Python de ese filtro sobre el modelo de Heston, con licencia MIT. Es la compañera de mi pricer de opciones: el pricer simula Heston hacia delante, el filtro trabaja hacia atrás desde los datos.' } } ] }
    ] },

  { slug: 'tfg', name: 'QUBO Thesis', art: 'qubo', repo: null, cat: 'quant',
    short: { en: 'Portfolio selection as a problem quantum annealers can read.', es: 'Selección de carteras como un problema que un quantum annealer puede leer.' },
    lead: { en: 'Research proposal for a bachelor’s thesis on QUBO formulations of cardinality-constrained portfolio optimization: holding only k assets out of many. It connects discrete mathematics, quantum annealing on D-Wave and QAOA in Qiskit to quantum finance.', es: 'Propuesta de TFG sobre formulaciones QUBO de optimización de carteras con restricción de cardinalidad: mantener solo k activos de entre muchos. Une matemática discreta, quantum annealing en D-Wave y QAOA en Qiskit con finanzas cuánticas.' },
    type: { en: 'Thesis proposal · in progress', es: 'Propuesta de TFG · en curso' }, stack: 'LaTeX · Qiskit · D-Wave', methods: 'QUBO · Quantum annealing · QAOA', figs: [],
    secs: [
      { h: { en: 'The problem', es: 'El problema' }, b: [
        { p: { en: 'Markowitz portfolio theory tells you how to weight assets. Real investors also want to hold only a handful of them: k out of hundreds. That cardinality constraint turns a smooth optimisation into a combinatorial one, which is NP-hard in general.', es: 'La teoría de carteras de Markowitz dice cómo ponderar activos. Los inversores reales también quieren tener solo unos pocos: k de entre cientos. Esa restricción de cardinalidad convierte una optimización suave en una combinatoria, que en general es NP-difícil.' } } ] },
      { h: { en: 'The idea', es: 'La idea' }, b: [
        { p: { en: 'A QUBO, quadratic unconstrained binary optimisation, asks for the binary vector x that minimises xᵀQx. Each binary variable says whether an asset is in the portfolio. Risk and expected return become entries of Q, and the cardinality constraint is folded in as a penalty that grows when the number of selected assets is not k. Once a problem is a QUBO, it can be handed to hardware that speaks that language.', es: 'Un QUBO, optimización binaria cuadrática sin restricciones, pide el vector binario x que minimiza xᵀQx. Cada variable binaria dice si un activo está en la cartera. El riesgo y el retorno esperado pasan a ser entradas de Q, y la restricción de cardinalidad se incorpora como una penalización que crece cuando el número de activos elegidos no es k. Cuando un problema es un QUBO, se puede entregar a hardware que habla ese lenguaje.' } },
        { code: 'min  xᵀQx      x ∈ {0,1}ⁿ\npenalty:  λ · (Σ xᵢ − k)²' } ] },
      { h: { en: 'Two quantum routes', es: 'Dos rutas cuánticas' }, b: [
        { ul: [ { en: 'Quantum annealing on D-Wave, hardware built to minimise exactly this kind of energy function.', es: 'Quantum annealing en D-Wave, hardware pensado para minimizar justo este tipo de función de energía.' }, { en: 'QAOA in Qiskit, the variational algorithm for gate-based quantum computers.', es: 'QAOA en Qiskit, el algoritmo variacional para ordenadores cuánticos de puertas.' } ] } ] },
      { h: { en: 'Status', es: 'Estado' }, b: [
        { p: { en: 'The research proposal is finalised and written up as a full LaTeX document. The thesis runs from 2026 to 2028.', es: 'La propuesta de investigación está cerrada y redactada como un documento completo en LaTeX. El TFG va de 2026 a 2028.' } } ] }
    ] },

  { slug: 'pause', name: 'Pause', art: 'pause', repo: 'pause', live: 'https://claudialbombin.github.io/pause/', cat: 'software',
    short: { en: 'A breathing exercise before the apps you cannot put down.', es: 'Un ejercicio de respiración antes de las apps que no puedes soltar.' },
    lead: { en: 'A mindful friction layer for addictive apps. Before Instagram, TikTok, YouTube or any app you choose, it opens a short breathing exercise. It breaks the autopilot habit loop without hard blocking.', es: 'Una capa de fricción consciente para apps adictivas. Antes de Instagram, TikTok, YouTube o la app que elijas, abre un breve ejercicio de respiración. Rompe el bucle de hábito automático sin bloquear nada.' },
    type: { en: 'Personal project', es: 'Proyecto personal' }, stack: 'HTML · JavaScript', methods: 'Product design', figs: [],
    secs: [
      { h: { en: 'The problem', es: 'El problema' }, b: [
        { p: { en: 'Most of the time you do not decide to open Instagram; your thumb does. The habit loop runs on autopilot: trigger, open, scroll.', es: 'La mayoría de las veces no decides abrir Instagram; lo hace tu pulgar. El bucle del hábito funciona en piloto automático: disparador, abrir, hacer scroll.' } } ] },
      { h: { en: 'The idea', es: 'La idea' }, b: [
        { p: { en: 'Pause adds a small amount of friction at exactly that moment. Before Instagram, TikTok, YouTube or any app you choose, it opens a short breathing exercise. Nothing is blocked; the point is to give you one breath in which to decide.', es: 'Pause añade un poco de fricción justo en ese momento. Antes de Instagram, TikTok, YouTube o la app que elijas, abre un breve ejercicio de respiración. No se bloquea nada; la idea es darte una respiración para decidir.' } },
        { ul: [ { en: 'Friction instead of blocking, to interrupt the habit without fighting the person using it.', es: 'Fricción en vez de bloqueo, para interrumpir el hábito sin pelearse con quien lo usa.' }, { en: 'You choose which apps trigger it.', es: 'Tú eliges qué apps lo activan.' } ] } ] },
      { h: { en: 'Under the hood', es: 'Por dentro' }, b: [
        { p: { en: 'Built with plain HTML and JavaScript. The repository includes a web app manifest, so it can behave like an installable app.', es: 'Hecho con HTML y JavaScript puros. El repositorio incluye un manifiesto de aplicación web, de modo que puede comportarse como una app instalable.' } } ] }
    ] },

  { slug: 'recetario-familiar', name: 'Recetario', art: 'recipe', repo: 'recetario-familiar', live: 'https://claudialbombin.github.io/recetario-familiar/', cat: 'software',
    short: { en: 'A cozy family recipe book with a page-turning cover, on the web.', es: 'Un recetario familiar acogedor con tapa que se abre, en la web.' },
    lead: { en: 'A cozy recipe book for the family, built as a web app and deployed to GitHub Pages: a book that opens, turns its pages and scales every recipe to the number of people at the table.', es: 'Un recetario acogedor para la familia, hecho como aplicación web y desplegado en GitHub Pages: un libro que se abre, pasa sus páginas y ajusta cada receta al número de comensales.' },
    type: { en: 'Personal project', es: 'Proyecto personal' }, stack: 'HTML · CSS · JavaScript', methods: 'Web app · UI design', figs: [],
    secs: [
      { h: { en: 'The brief', es: 'La idea' }, b: [
        { p: { en: 'A place for the family’s recipes to live, that feels handmade rather than like software. The look comes from an embroidered striped tote bag: burgundy and cream ticking stripes, cross-stitch borders, floral embroidery and leather accents, translated into a digital cookbook.', es: 'Un lugar donde vivan las recetas de la familia, que se sienta hecho a mano y no como un software. El aspecto viene de un bolso de tela con rayas bordadas: rayas burdeos y crudo, bordes de punto de cruz, bordados florales y detalles de cuero, traducidos a un recetario digital.' } } ] },
      { h: { en: 'What it does', es: 'Qué hace' }, b: [
        { ul: [ { en: 'A 3D book-opening animation with page-flip transitions and a two-page spread, which switches to a single continuous layout on phones.', es: 'Una animación 3D de apertura de libro con cambio de página y doble página, que pasa a una sola página continua en el móvil.' }, { en: 'Add, edit and delete recipes, with photo upload and in-browser image compression.', es: 'Añadir, editar y borrar recetas, con subida de fotos y compresión de imagen en el navegador.' }, { en: 'Chapters and categories you can add, rename and delete.', es: 'Capítulos y categorías que se pueden añadir, renombrar y borrar.' }, { en: 'A spice level from 1 to 5 chillies, vegan and vegetarian flags, and free-form tags.', es: 'Nivel de picante de 1 a 5 guindillas, marcas de vegano y vegetariano y etiquetas libres.' }, { en: 'A servings scaler that recalculates ingredient quantities proportionally.', es: 'Un escalador de raciones que recalcula las cantidades de los ingredientes de forma proporcional.' }, { en: 'Search across title, ingredients, category and tags, and a filter by diet and chapter.', es: 'Búsqueda por título, ingredientes, categoría y etiquetas, y filtro por dieta y capítulo.' } ] } ] },
      { h: { en: 'How it is built', es: 'Cómo está hecho' }, b: [
        { p: { en: 'One standalone index.html with no build step, deployed on GitHub Pages, with recipes stored in the browser. The two-page book needed JavaScript viewport detection, because CSS alone could not serve the phone and desktop layouts properly. Native browser dialogs were replaced by custom modals. It went from first concept to a deployed product in one long working session.', es: 'Un único index.html sin paso de compilación, desplegado en GitHub Pages, con las recetas guardadas en el navegador. El libro de doble página necesitó detección de viewport con JavaScript, porque solo con CSS no se podían servir bien los diseños de móvil y de escritorio. Los diálogos nativos del navegador se sustituyeron por modales propios. Pasó de la primera idea a un producto desplegado en una larga sesión de trabajo.' } } ] }
    ] },

  { slug: 'a-maze-ing', name: 'A-Maze-ing', art: 'maze', repo: '42/tree/main/Cursus/Rank02/A-maze-ing', repoLabel: '42/A-maze-ing', cat: 'software',
    short: { en: 'A reproducible maze generator with a “42” in the middle, in Python, at 42 Madrid.', es: 'Un generador de laberintos reproducible con un “42” en el centro, en Python, en 42 Madrid.' },
    lead: { en: 'A maze generator written with a partner for the 42 Madrid curriculum. It reads a configuration file, generates a maze that is always the same for the same seed, writes it to a file with one hexadecimal digit per cell and draws it in the terminal in colour.', es: 'Un generador de laberintos escrito en pareja para el currículo de 42 Madrid. Lee un archivo de configuración, genera un laberinto que siempre es el mismo para la misma semilla, lo escribe en un archivo con un dígito hexadecimal por celda y lo dibuja en la terminal en color.' },
    type: { en: 'Coursework · 42 Madrid', es: 'Curso · 42 Madrid' }, stack: 'Python · flake8 · mypy', methods: 'Graph algorithms', figs: [],
    secs: [
      { h: { en: 'Two kinds of maze', es: 'Dos tipos de laberinto' }, b: [
        { ul: [ { en: 'Perfect: exactly one path between the entry and the exit, with no loops.', es: 'Perfecto: exactamente un camino entre la entrada y la salida, sin bucles.' }, { en: 'Not perfect: a board for a Pac-Man-like game, with many loops and no dead ends beyond those closed by the “42”.', es: 'No perfecto: un tablero para un juego tipo Pac-Man, con muchos bucles y sin más callejones que los que cierra el “42”.' } ] } ] },
      { h: { en: 'The algorithm', es: 'El algoritmo' }, b: [
        { p: { en: 'The default is a recursive backtracker, a random depth-first search that produces a spanning tree of the cells, which is what makes the maze perfect. It uses a list as a stack and not real recursion, because Python reaches its recursion limit on big mazes. Prim’s algorithm is available as an option.', es: 'Por defecto usa un backtracker recursivo, una búsqueda en profundidad aleatoria que produce un árbol generador de las celdas, y eso es lo que hace perfecto al laberinto. Usa una lista como pila y no recursión real, porque Python llega a su límite de recursión con laberintos grandes. El algoritmo de Prim está disponible como opción.' } } ] },
      { h: { en: 'Details', es: 'Detalles' }, b: [

  function erf(x) { var s = x < 0 ? -1 : 1; x = Math.abs(x); var t = 1 / (1 + .3275911 * x); return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x)); }

    for (p = 0; p < NP; p++) { s = S0; ix = p * (STEPS + 1); PP[ix] = s; for (k = 1; k <= STEPS; k++) { s *= Math.exp(dr + vo * Z[p * STEPS + k - 1]); PP[ix + k] = s; if (s < mn) mn = s; if (s > mx) mx = s; } }

    document.getElementById('r3').textContent = fmt(st.ml, 1) + ' – ' + fmt(st.mh, 1); document.getElementById('r3x').textContent = ex + fmt(st.el, 1) + ' – ' + fmt(st.eh, 1);
  }
  function drawSim(prog) {

    var dpr = window.devicePixelRatio || 1; if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }

    ctx.setLineDash([2, 4]); ctx.strokeStyle = '#6F6963'; ctx.beginPath(); ctx.moveTo(x0, Math.round(Y(K)) + .5); ctx.lineTo(x1, Math.round(Y(K)) + .5); ctx.stroke(); ctx.setLineDash([]);
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom'; ctx.fillStyle = '#6F6963'; ctx.fillText('K', x0 + 6, Y(K) - 4);

    sync(); if (!Z) newDraws(); recompute(); drawSim(1);
  }

  /* ---------------- router ---------------- */
  var app = document.getElementById('app'), menu = document.getElementById('menu'), menuBtn = document.getElementById('menuBtn'), menuOpen = false;
  function route() {
    var h = location.hash.replace(/^#\/?/, '').split('/'), html;
    if (h[0] === 'works' && h[1]) html = detailView(h[1]); else if (h[0] === 'works') html = worksView(); else if (h[0] === 'about') html = aboutView(); else html = homeView();
    app.innerHTML = html; applyUI(); drawAll(); initSim(); tick();
    document.querySelectorAll('.chip').forEach(function (b) { b.addEventListener('click', function () { filter = b.getAttribute('data-f'); var y = window.scrollY; route(); window.scrollTo(0, y); }); });
  }
  var lastHash = null;
  function onHash() { setMenu(false); var changed = location.hash !== lastHash; lastHash = location.hash; route(); if (changed) window.scrollTo(0, 0); }
  function setMenu(o) { menuOpen = o; menu.hidden = !o; menuBtn.setAttribute('aria-expanded', o); document.body.style.overflow = o ? 'hidden' : ''; applyUI(); }

  setInterval(tick, 30000);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { drawAll(); drawSim(sim.prog); }, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawAll(); drawSim(sim.prog); });
